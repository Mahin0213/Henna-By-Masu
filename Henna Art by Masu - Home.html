<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How much is henna in Leicester?","acceptedAnswer":{"@type":"Answer","text":"Simple henna designs start at £10, semi bridal at £30 and bridal mehndi at £50. Party and event work is quoted by the hours and guest numbers, agreed before the date."}},{"@type":"Question","name":"Do you use black henna?","acceptedAnswer":{"@type":"Answer","text":"Never. Black henna contains PPD, which burns and scars skin. We use organic henna cones mixed with lemon, sugar and essential oils only — the stain arrives orange and deepens to brown over two days."}},{"@type":"Question","name":"Do you draw Arabic and Khaleeji designs?","acceptedAnswer":{"@type":"Answer","text":"Yes. Arabic and Khaleeji styles, fine modern linework, and dense traditional Indian panels are all drawn freehand — no stencils, no transfers."}},{"@type":"Question","name":"How far do you travel from Leicester?","acceptedAnswer":{"@type":"Answer","text":"Across Leicestershire including Loughborough and Oadby as standard, and out to Birmingham, Coventry, Nottingham and Derby. Luton, Northampton and London are taken as full-day bookings."}},{"@type":"Question","name":"How long does bridal mehndi take?","acceptedAnswer":{"@type":"Answer","text":"Five to six hours for full hands, feet and forearms. Semi bridal is around two hours. Guest tables run for as long as the evening needs."}},{"@type":"Question","name":"How far ahead should I book?","acceptedAnswer":{"@type":"Answer","text":"Three months is comfortable for a bride. For a Saturday between May and October, or around Eid, three to six months is usual. Smaller designs can often be fitted in sooner."}}]}</script>
